syntax = "proto3";

package titip;

option go_package = "github.com/indragunawan/titip/proto;proto";

message HeaderValues {
  repeated string values = 1;
}

message EsiFragment {
  int64 start_pos = 1;
  int64 end_pos = 2;
  string src = 3;
  string alt = 4;
  string on_error = 5;
  uint32 max_depth = 6;
  int64 timeout_ms = 7;
  int64 inner_start_pos = 8;
  int64 inner_end_pos = 9;
}

// VariantInfo stores metadata for a specific Vary header combination
message VariantInfo {
  string variant_key = 1;                 // Unique storage subkey e.g., "gzip_en"
  map<string, string> vary_headers = 2;   // Matched request headers e.g. {"Accept-Encoding": "gzip"}
  int32 status_code = 3;
  map<string, HeaderValues> response_headers = 4;
  string etag = 5;
  int64 last_modified_unix_nano = 6;
  int64 raw_body_size = 7;
  repeated EsiFragment esi_fragments = 8;
}

// CacheMetadata stores the primary URL index and variant registry
message CacheMetadata {
  string primary_key = 1;
  repeated string vary_header_names = 2;  // e.g. ["Accept-Encoding", "Accept-Language"]
  map<string, VariantInfo> variants = 3;   // Keyed by normalized vary values
  int64 created_at_unix_nano = 4;
  int64 expires_at_unix_nano = 5;
  int64 stale_until_unix_nano = 6;
  int64 corrected_initial_age_seconds = 7;
  repeated string tags = 8;
}
